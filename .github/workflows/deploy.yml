name: Deploy Vercel

# Auto-deploy produksi tiap push ke main. Butuh repo secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (kalau Vercel GitHub App ke-install, workflow ini opsional / bisa dimatiin)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm i -g vercel@latest
      # Deploy source langsung: server Vercel yang build (sudah ada uv/python di sana).
      # Alur prebuilt sebelumnya error "readlink PROGRESS.md" di runner Actions.
      - name: Deploy to Vercel (production)
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
